<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><meta name="description" content="AI Academy — formation IA en duo sur 15 mois, 300 leçons, notes et suivi synchronisé."><title>AI Academy — apprendre à deux</title><link rel="stylesheet" href="style.css"></head><body>
